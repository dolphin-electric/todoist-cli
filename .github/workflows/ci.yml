name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    name: Smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: CLI help smoke test
        run: |
          uv run python -m todoist_cli.cli --help
          uv run python -m todoist_cli.cli tasks --help
          uv run python -m todoist_cli.cli projects --help
          uv run python -m todoist_cli.cli sections --help
          uv run python -m todoist_cli.cli boards --help
          uv run python -m todoist_cli.cli calendar --help

  build:
    name: Build + Twine Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Validate distributions
        run: uvx twine check dist/*
